{% extends "main.html" %}
{% block content %}
<div id="pocetniCarousel" class="carousel slide carousel-fade carouselhome mb-5" data-bs-ride="carousel">
        <div class="carousel-indicators" id="carouselIndikatori"></div>
        <div class="carousel-inner h-100" id="carouselSlike"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#pocetniCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#pocetniCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
<div class="container mt-4 mb-5">
    <div id="pinanaObjava"></div>

    <h1 class="mb-4">Portfolio</h1>
    
    <section class="mb-5">
        <h3>Projects</h3>
        <div class="filter-bar mt-3 mb-3">
            <input type="text" id="fPretraga" class="form-control" placeholder="Search projects...">
            <select id="fJezik" class="form-select"></select>
            <select id="fStatus" class="form-select"></select>
            <button type="button" class="btn btn-outline-secondary btn-clear" id="fReset">Clear</button>
        </div> 
        <div id="pLista" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4"></div>
    </section>

    <section class="mb-5">
        <h3>Posts</h3>
        <div id="oLista" class="mt-3"></div>
    </section>
</div>

<script>
let pSvi = [];

async function ucitajProjekte() {
    const odgovor = await fetch('/api/projekti');
    pSvi = await odgovor.json();

    popuniFilterOpcije();
    primijeniFiltere();
}

function popuniFilterOpcije() {
    const jezici = [...new Set(pSvi.flatMap(p => p.tagovi))].sort();
    const statusi = [...new Set(pSvi.map(p => p.status))].sort();

    document.getElementById('fJezik').innerHTML =
        '<option value="">All languages</option>' +
        jezici.map(j => `<option value="${j}">${j}</option>`).join('');

    document.getElementById('fStatus').innerHTML =
        '<option value="">All statuses</option>' +
        statusi.map(s => `<option value="${s}">${s}</option>`).join('');
}

function primijeniFiltere() {
    const tekst = document.getElementById('fPretraga').value.toLowerCase().trim();
    const jezik = document.getElementById('fJezik').value;
    const status = document.getElementById('fStatus').value;

    const filtrirano = pSvi.filter(p => {
        const uTekstu = !tekst ||
            p.naziv.toLowerCase().includes(tekst) ||
            p.opis.toLowerCase().includes(tekst);
        const uJeziku = !jezik || p.tagovi.includes(jezik);
        const uStatusu = !status || p.status === status;
        return uTekstu && uJeziku && uStatusu;
    });

    renderProjekti(filtrirano);
}

function renderProjekti(svi) {
    const lista = document.getElementById('pLista');
    lista.innerHTML = svi.length ? '' : '<p>No projects match your filters.</p>';

    svi.forEach(p => {
        const kol = document.createElement('div');
        kol.className = 'col';
        kol.innerHTML = `
            <div class="card p-3 h-100 project-card">
                <h5>${p.naziv}</h5>
                <div class="projekt-meta">
                    ${p.tagovi.map(t => `<span class="projekt-jezik">${t}</span>`).join('')}
                    <span class="projekt-status">${p.status}</span>
                </div>
                <p class="projekt-opis">${p.opis}</p>
                <a href="${p.link}" target="_blank" class="btn btn-sm btn-outline-primary mt-auto">GitHub</a>
            </div>`;
        lista.appendChild(kol);
    });
}

document.getElementById('fPretraga').addEventListener('input', primijeniFiltere);
document.getElementById('fJezik').addEventListener('change', primijeniFiltere);
document.getElementById('fStatus').addEventListener('change', primijeniFiltere);
document.getElementById('fReset').addEventListener('click', () => {
    document.getElementById('fPretraga').value = '';
    document.getElementById('fJezik').value = '';
    document.getElementById('fStatus').value = '';
    primijeniFiltere();
});

function prikaziPrikvacenu(najnovija) {
    const wrap = document.getElementById('pinanaObjava');
    if (!najnovija) { wrap.innerHTML = ''; return; }

    wrap.innerHTML = `
        <div class="card p-4 mb-5 prikvacena-objava">
            <span class="badge-pin">Latest post</span>
            <h4 class="mt-2 mb-1">${najnovija.naziv}</h4>
            <p class="post-datum">${najnovija.datum}</p>
            ${najnovija.slika ? `<img src="${najnovija.slika}" class="img-fluid rounded my-2" alt="">` : ''}
            <p class="mb-0">${najnovija.tekst}</p>
        </div>`;
}

async function ucitajObjave() {
    const odgovor = await fetch('/api/objave');
    const sve = await odgovor.json();

    prikaziPrikvacenu(sve[0]);

    const lista = document.getElementById('oLista');
    const ostale = sve.slice(1);
    lista.innerHTML = ostale.length ? '' : (sve.length ? '' : '<p>No posts yet.</p>');

    ostale.forEach(o => {
        const el = document.createElement('div');
        el.className = 'card p-3 mb-3 post-card';
        el.innerHTML = `
            <div class="d-flex justify-content-between align-items-start">
                <h5 class="mb-1">${o.naziv}</h5>
                <span class="post-datum">${o.datum}</span>
            </div>
            ${o.slika ? `<img src="${o.slika}" class="img-fluid rounded my-2" alt="">` : ''}
            <p class="mb-0">${o.tekst}</p>`;
        lista.appendChild(el);
    });
}

async function ucitajCarousel() {
    const odgovor = await fetch('/api/slike');
    const sve = await odgovor.json();
    const zaCarousel = sve.filter(s => s.u_carouselu);

    const wrapper = document.getElementById('pocetniCarousel');
    const indikatori = document.getElementById('carouselIndikatori');
    const inner = document.getElementById('carouselSlike');

    if (zaCarousel.length === 0) {
        wrapper.style.display = 'none';
        return;
    }

    indikatori.innerHTML = zaCarousel.map((s, i) => `
        <button type="button" data-bs-target="#pocetniCarousel" data-bs-slide-to="${i}"
            class="${i === 0 ? 'active' : ''}" aria-current="${i === 0 ? 'true' : 'false'}"></button>
    `).join('');

    inner.innerHTML = zaCarousel.map((s, i) => `
        <div class="carousel-item ${i === 0 ? 'active' : ''} h-100">
            <img src="${s.slika}" class="d-block w-100 h-100 carousel-slika">
            <div class="carousel-caption d-none d-md-block">
                <h5>${s.projekt_naziv}</h5>
            </div>
        </div>
    `).join('');
}

ucitajCarousel();
ucitajProjekte();
ucitajObjave();
</script>
{% endblock %}
